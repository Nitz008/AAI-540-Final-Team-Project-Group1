name: Modeling tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install reproducible notebook and training dependencies
        run: python -m pip install -r requirements-sagemaker.txt
      - name: Validate notebook structure and compile code cells
        run: python scripts/validate_notebooks.py
      - name: Run modeling, data-isolation and artifact checks
        run: python -m unittest discover -s tests -v
